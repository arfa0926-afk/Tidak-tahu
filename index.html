
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111c">
<title>Room Wangi MLBB</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;min-height:100vh;
  display:grid;place-items:center;
  font-family:Arial,sans-serif;color:white;
  background:radial-gradient(ellipse at top,#123b50,transparent 65%),#070b13
}
main{
  width:100%;max-width:430px;padding:25px;
  border:1px solid #00dfff;border-radius:20px;
  background:#0b1522;box-shadow:0 0 30px #00dfff20
}
.logo{text-align:center;font-size:44px}
h1{text-align:center;color:#00eaff;letter-spacing:2px}
.sub{text-align:center;color:#94adbf;font-size:12px}
label{display:block;margin:18px 0 8px;font-size:13px}
input,select{
  width:100%;padding:13px;border-radius:9px;
  border:1px solid #29485a;background:#07121e;
  color:white;font-size:14px
}
button{
  width:100%;padding:14px;margin-top:15px;
  border:0;border-radius:9px;font-weight:bold;cursor:pointer
}
.primary{background:linear-gradient(90deg,#00cfff,#00e9ae);color:#041019}
.secondary{background:#13283a;color:#e1f7ff;border:1px solid #315166}
.info{
  margin-top:20px;padding:14px;border-radius:10px;
  background:#07101a;font-size:12px;line-height:1.8;color:#c6dce8
}
.small{text-align:center;color:#849aaa;font-size:10px;line-height:1.7;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="logo">⚔️</div>
  <h1>ROOM WANGI</h1>
  <p class="sub">MOBILE LEGENDS • BOT PRACTICE</p>

  <label for="id">ID Mobile Legends (opsional)</label>
  <input id="id" inputmode="numeric" placeholder="ID pemain">

  <label for="server">Wilayah pilihan (catatan pribadi)</label>
  <select id="server">
    <option>Indonesia</option>
    <option>Singapura</option>
    <option>Malaysia</option>
    <option>Filipina</option>
    <option>Lainnya</option>
  </select>

  <button class="primary" id="open">BUKA MOBILE LEGENDS</button>
  <button class="secondary" id="guide">CARA MASUK ROOM BOT</button>

  <div class="info" id="info" aria-live="polite">
    Status: halaman siap digunakan.<br>
    Belum ada koneksi langsung ke server MLBB.
  </div>

  <p class="small">
    Fan-made website. Pilihan wilayah hanya catatan pribadi
    dan tidak mengubah server akun. Jangan masukkan password
    atau kode OTP.
  </p>
</main>

<script>
const info = document.getElementById("info");

document.getElementById("open").addEventListener("click",()=>{
  info.textContent = "Mencoba membuka aplikasi Mobile Legends...";
  window.location.href = "mobilelegends://";
});

document.getElementById("guide").addEventListener("click",()=>{
  info.replaceChildren();

  const title = document.createElement("strong");
  title.textContent = "CARA BERMAIN MELAWAN BOT";
  info.appendChild(title);

  [
    "1. Buka Mobile Legends.",
    "2. Masuk ke menu pemilihan mode.",
    "3. Pilih VS AI untuk pertandingan melawan komputer.",
    "4. Atau pilih Custom jika ingin mengatur room dan slot bot yang tersedia.",
    "5. Atur tim dan mulai pertandingan dari dalam game."
  ].forEach(text=>{
    const p=document.createElement("p");
    p.textContent=text;
    info.appendChild(p);
  });
});
</script>
</body>
</html>
